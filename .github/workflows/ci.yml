name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_repository.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - name: Run tests
        run: |
          set +e
          uv run pytest --cov --junitxml=pytest-results.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            PYTEST_EXIT_STATUS="$status" uv run python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = ET.parse("pytest-results.xml")
          for case in report.iter("testcase"):
              if case.find("failure") is None and case.find("error") is None:
                  continue
              node_id = "::".join(
                  part
                  for part in (case.get("classname"), case.get("name"))
                  if part
              )
              safe_node_id = node_id.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(
                  f"::error title=pytest failure::{safe_node_id or 'unknown test'}",
                  flush=True,
              )
          raise SystemExit(int(os.environ["PYTEST_EXIT_STATUS"]))
          PY
          fi
          exit "$status"

  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/build_release.py --python 3.11
