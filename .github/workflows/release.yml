name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      python_version:
        description: Python used to build and install-test the universal wheel
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      repository:
        description: Package index target
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.repository || 'pypi' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and the requested Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ inputs.python_version || '3.11' }}

      - name: Install the locked development environment
        run: uv sync --locked --all-groups

      - name: Run quality and secret-hygiene gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run python scripts/check_repository.py

      - name: Run tests
        run: uv run pytest --cov

      - name: Build a tag-matched release
        if: github.event_name == 'push'
        run: >-
          uv run python scripts/build_release.py
          --python "${{ inputs.python_version || '3.11' }}"
          --expected-tag "${GITHUB_REF_NAME}"

      - name: Build a manually dispatched release candidate
        if: github.event_name == 'workflow_dispatch'
        run: >-
          uv run python scripts/build_release.py
          --python "${{ inputs.python_version }}"

      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to ${{ github.event_name == 'push' && 'pypi' || inputs.repository }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || inputs.repository }}
      url: ${{ (github.event_name == 'push' || inputs.repository == 'pypi') && 'https://pypi.org/project/codex-provider-switchboard/' || 'https://test.pypi.org/project/codex-provider-switchboard/' }}
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist

      - name: Publish to TestPyPI with a trusted identity
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1.14
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI with a trusted identity
        if: github.event_name == 'push' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1.14
        with:
          packages-dir: dist/
